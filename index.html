<style>
  :root { --fg:#fff; --card:rgba(255,255,255,.14); --line:rgba(255,255,255,.22); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; color:var(--fg);
    font-family:"Figtree","Noto Sans KR","Noto Sans JP","Noto Sans SC","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#4a90e2,#1c3f78); background-attachment:fixed;
    transition:background .6s;
  }
  body.clear-day{background:linear-gradient(160deg,#4facfe,#1e6fd0)}
  body.clear-night{background:linear-gradient(160deg,#1b2a52,#0a1022)}
  body.cloudy{background:linear-gradient(160deg,#7b8a9a,#445063)}
  body.rain{background:linear-gradient(160deg,#52657c,#26303f)}
  body.snow{background:linear-gradient(160deg,#9db7d1,#5d7690)}
  body.storm{background:linear-gradient(160deg,#4a4060,#1a1826)}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px;position:relative}
  #bg,#bgVideo{position:fixed;inset:0;width:100%;height:100%;z-index:-3}
  #bg{opacity:0;transition:opacity .9s ease}
  #bgVideo{object-fit:cover;display:none}
  #scrim{position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(rgba(0,0,0,.10),rgba(0,0,0,.30))}
  .card,.top,.note,.status{text-shadow:0 1px 8px rgba(0,0,0,.28)}
  .card{backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
  .top{display:flex;gap:10px;align-items:center;margin-bottom:20px;position:relative}
  .search{flex:1;min-width:0;position:relative}
  .search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.85;pointer-events:none}
  input,select,button{
    height:48px;font:inherit;font-size:.98rem;color:var(--fg);background:var(--card);border:0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
    border-radius:999px;padding:0 20px;outline:none;
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    transition:background .2s, box-shadow .2s;
  }
  input{width:100%;padding-left:46px}
  input::placeholder{color:rgba(255,255,255,.72)}
  input:focus,select:focus-visible,button:focus-visible{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75)}
  select{
    appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:42px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 18px center;background-size:14px;
  }
  select option{color:#111}
  button{cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:500}
  button svg{width:18px;height:18px;flex:none}
  button:hover,select:hover{background-color:rgba(255,255,255,.24)}
  button:active{transform:scale(.97)}
  .results{
    position:absolute;top:100%;left:0;right:0;margin-top:8px;z-index:10;
    background:rgba(20,30,50,.95);border:0;border-radius:24px;overflow:hidden;display:none;
  }
  .results div{padding:10px 12px;cursor:pointer;font-size:.95rem}
  .results div:hover{background:rgba(255,255,255,.14)}
  .results small{opacity:.7}
  .card{background:var(--card);border:0;border-radius:30px;padding:24px;margin-bottom:14px}
  .hero{text-align:center}
  .place{font-size:1.4rem;font-weight:600;letter-spacing:-.01em}
  .sub{opacity:.8;font-size:.9rem;margin-top:2px}
  .icon{font-size:5rem;line-height:1.1;margin-top:8px}
  .temps{display:flex;justify-content:center;align-items:baseline;gap:18px;flex-wrap:wrap;margin-top:4px}
  .tp{font-size:5.6rem;font-weight:300;letter-spacing:-.045em;line-height:1}
  .ts{font-size:2rem;font-weight:300;opacity:.8}
  .desc{font-size:1.3rem;margin-top:4px}
  .hl{opacity:.85;margin-top:6px;font-size:.95rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:rgba(255,255,255,.1);border-radius:22px;padding:14px 16px}
  .stat .k{font-size:.8rem;opacity:.75}
  .stat .v{font-size:1.15rem;margin-top:4px;font-weight:500}
  .stat .v small{opacity:.75;font-weight:400;font-size:.8rem}
  h2{font-size:1rem;opacity:.9;margin-bottom:14px;font-weight:600;letter-spacing:-.01em}
  .hourly{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
  .hr{flex:0 0 auto;min-width:78px;text-align:center;background:rgba(255,255,255,.1);border-radius:26px;padding:14px 8px}
  .hr .t{font-size:.8rem;opacity:.8}
  .hr .i{font-size:1.6rem;margin:4px 0}
  .hr .c{font-weight:600}
  .hr .f{font-size:.75rem;opacity:.75}
  .hr .p{font-size:.75rem;margin-top:4px;color:#bfe3ff}
  .day{display:grid;grid-template-columns:70px 36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .day:first-of-type{border-top:0}
  .day .n{font-weight:500}
  .day .i{font-size:1.5rem;text-align:center}
  .day .d{font-size:.85rem;opacity:.85}
  .day .r{text-align:right;font-size:.9rem;white-space:nowrap}
  .day .r small{opacity:.75}
  .status{text-align:center;padding:40px 0;opacity:.9}
  .note{text-align:center;font-size:.85rem;opacity:.8;margin-bottom:12px}
  footer{text-align:center;font-size:.75rem;opacity:.65;margin-top:20px}
  #setBtn,#pipBtn{padding:0 14px;justify-content:center}
  #pipBtn.on{background:#fff;color:#16223a}
  /* 상단 미니 위젯: 아이폰(다이나믹 아일랜드 위치) / 갤럭시(왼쪽 위) */
  #miniW{position:fixed;z-index:40;display:none;align-items:center;gap:8px;height:37px;padding:0 14px;border-radius:999px;
    background:rgba(0,0,0,.72);color:#fff;font-weight:600;font-size:.9rem;white-space:nowrap;text-shadow:none;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none}
  #miniW .mi{font-size:1.15rem;line-height:1}
  #miniW .mn{font-weight:400;opacity:.8;font-size:.8rem;max-width:90px;overflow:hidden;text-overflow:ellipsis}
  #miniW.island{top:11px;left:50%;transform:translateX(-50%);width:218px;padding:0 16px;gap:0;justify-content:space-between;background:#000}
  #miniW.island .gap{width:126px;flex:none}
  #miniW.topleft{top:calc(env(safe-area-inset-top,0px) + 8px);left:10px}
  #miniW.topcenter{top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%)}
  body.mini-island .wrap{padding-top:64px}
  body.mini-flow .wrap{padding-top:calc(env(safe-area-inset-top,0px) + 58px)}
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .overlay.open{display:flex}
  .panel{width:100%;max-width:460px;max-height:86vh;overflow:auto;background:rgba(22,32,52,.94);border-radius:28px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .panel h2{font-size:1.15rem;opacity:1;margin-bottom:6px}
  .srow{padding:12px 0;border-top:1px solid var(--line)}
  .srow:first-of-type{border-top:0}
  .srow .sl{font-size:.85rem;opacity:.8;margin-bottom:8px}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{height:34px;padding:0 14px;font-size:.88rem;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);background:rgba(255,255,255,.08)}
  .seg button.on{background:#fff;color:#16223a;font-weight:600;box-shadow:none}
  .pfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .pfoot button{height:40px}
  .shint{font-size:.78rem;opacity:.65;margin-top:6px;line-height:1.4}
  @media (max-width:520px){
    .tp{font-size:4rem}.ts{font-size:1.5rem}
    .top{flex-wrap:wrap}.search{flex:1 1 100%}
    #locBtn{flex:1;justify-content:center}#langSel{flex:1}
    .day{grid-template-columns:56px 30px 1fr;}
    .day .r{grid-column:1 / -1;text-align:left}
  }
</style>
</head>
<body>
<video id="bgVideo" muted loop playsinline autoplay preload="auto"></video>
<canvas id="bg"></canvas>
<div id="scrim"></div>
<div class="wrap">
  <div class="top">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
    <button id="locBtn"></button>
    <button id="pipBtn" type="button"></button>
    <button id="setBtn" type="button"></button>
    <select id="langSel"></select>
  </div>
  <div id="note" class="note"></div>
  <div id="app"><div class="status" id="status"></div></div>
  <footer id="foot">정보제공: MET Norway · Geocoding: Open-Meteo, BigDataCloud</footer>
</div>

<div id="miniW"></div>
<div class="overlay" id="setOverlay"><div class="panel" id="setPanel"></div></div>

<script>
/* ---------- i18n ---------- */
const DESC_KEYS = ['clear','mostlyClear','partly','overcast','fog','drizzle','fzDrizzle','rainL','rain','rainH','fzRain','snowL','snow','snowH','grains','showers','showersH','snowSh','thunder','hail'];

const I18N = {
  ko:{name:'한국어',locale:'ko-KR',search:'도시 검색...',myLoc:'내 위치',auto:'자동',loading:'날씨를 불러오는 중...',locating:'위치 확인 중...',
    fallback:'위치 정보를 가져올 수 없어 기본 위치(서울)를 표시합니다.',error:'날씨 정보를 불러오지 못했습니다.',noResult:'검색 결과 없음',

/* ---------- unit helpers ---------- */
const cToF = c => c * 9/5 + 32;
const r0 = n => Math.round(n);
const r1 = n => Math.round(n*10)/10;
const kmhToMph = k => k * 0.621371;
const mmToIn = m => m / 25.4;
const hPaToInHg = h => h * 0.02953;
/* 화씨를 주로 쓰는 나라는 화씨를 크게, 그 외는 섭씨를 크게 */
const F_COUNTRIES = ['US','PR','GU','VI','AS','MP','BS','BZ','KY','LR','PW','FM','MH'];
function primaryIsF(){
  if(settings.temp === 'F') return true;
  if(settings.temp === 'C') return false;
  const cc = ((state.loc && state.loc.country) || '').toUpperCase();
  if(cc) return F_COUNTRIES.includes(cc);
  const m = (navigator.language || '').split('-')[1];
  return !!m && F_COUNTRIES.includes(m.toUpperCase());
}
function tp(c){
  const C = `${r0(c)}°C`, F = `${r0(cToF(c))}°F`;
  const o = primaryIsF() ? {main:F, sub:C} : {main:C, sub:F};
  if(!settings.dual) o.sub = '';
  return o;
}
function dual(c){ const t = tp(c); return t.sub ? `${t.main} / ${t.sub}` : t.main; }
function withSub(main, sub){ return settings.dual ? `${main} <small>/ ${sub}</small>` : main; }
function precipStr(mm){
  const a = `${r1(mm)} mm`, b = `${Math.round(mmToIn(mm)*100)/100} in`;
  return settings.precip === 'in' ? withSub(b, a) : withSub(a, b);
}
function precipMain(mm){ return settings.precip === 'in' ? `${Math.round(mmToIn(mm)*100)/100}in` : `${r1(mm)}mm`; }
function windStr(kmh){
  const v = { kmh:`${r0(kmh)} km/h`, mph:`${r0(kmhToMph(kmh))} mph`, ms:`${r1(kmh/3.6)} m/s` };
  const u = v[settings.wind] ? settings.wind : 'kmh';
  return withSub(v[u], u === 'kmh' ? v.mph : v.kmh);
}
function pressStr(h){
  const a = `${r0(h)} hPa`, b = `${r1(hPaToInHg(h))} inHg`;
  return settings.press === 'inhg' ? withSub(b, a) : withSub(a, b);
}
function hiLo(hi, lo){
  const F = primaryIsF();
  const a = F?cToF(hi):hi, b = F?cToF(lo):lo, a2 = F?hi:cToF(hi), b2 = F?lo:cToF(lo);
  const u1 = F?'°F':'°C', u2 = F?'°C':'°F';
  return { main:`${r0(a)}° / ${r0(b)}${u1}`, sub: settings.dual ? `${r0(a2)}° / ${r0(b2)}${u2}` : '' };
}

function degToDir(d){
  const dirs=['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(d/45)%8];
}

/* ---------- weather code ---------- */
function codeIndex(code){
  if(code===0) return 0; if(code===1) return 1; if(code===2) return 2; if(code===3) return 3;
  if(code===45||code===48) return 4;
  if([51,53,55].includes(code)) return 5;
  if([56,57].includes(code)) return 6;
  if(code===61) return 7; if(code===63) return 8; if(code===65) return 9;
  if([66,67].includes(code)) return 10;
  if(code===71) return 11; if(code===73) return 12; if(code===75) return 13; if(code===77) return 14;
  if([80,81].includes(code)) return 15; if(code===82) return 16;
  if([85,86].includes(code)) return 17;
  if(code===95) return 18;
  if([96,99].includes(code)) return 19;
  return 3;
}
function codeIcon(code, isDay=1){
  const i = codeIndex(code);
  if(i<=1) return isDay ? '☀️' : '🌙';
  if(i===2) return isDay ? '⛅' : '☁️';
  if(i===3) return '☁️';
  if(i===4) return '🌫️';
  if(i<=6) return '🌦️';
  if(i<=10) return '🌧️';
  if(i<=14) return '❄️';
  if(i<=16) return '🌦️';
  if(i===17) return '🌨️';
  return '⛈️';
}
function codeTheme(code, isDay){
  const i = codeIndex(code);
  if(i<=2) return isDay ? 'clear-day' : 'clear-night';
  if(i===4) return 'fog';
  if(i===3) return 'cloudy';
  if(i<=10 || i===15 || i===16) return 'rain';
  if(i<=14 || i===17) return 'snow';
  return 'storm';
}

/* ---------- Console weather background preview (Korean) ----------
   개발자 도구 콘솔에서 미리보기날씨('비') 처럼 입력하면 배경을 미리 볼 수 있습니다.
   미리보기날씨('원래대로') 또는 미리보기날씨()를 입력하면 실제 날씨 배경으로 복원합니다.
*/
const WEATHER_PREVIEW_THEMES = {
  '맑음':'clear-day', '맑은 낮':'clear-day', '맑은 밤':'clear-night', '밤':'clear-night',
  '흐림':'cloudy', '구름':'cloudy', '구름 많음':'cloudy', '안개':'fog',
  '비':'rain', '비옴':'rain', '비 오는 날':'rain', '소나기':'rain', '이슬비':'rain',
  '눈':'snow', '눈옴':'snow', '눈 오는 날':'snow', '폭설':'snow',
  '천둥':'storm', '번개':'storm', '뇌우':'storm', '폭풍':'storm', '폭풍우':'storm'
};
let weatherPreviewActive = false;
function previewWeatherBackground(weatherName){
  const name = String(weatherName ?? '').trim();
  if(!name || ['원래대로','복원','취소','실제 날씨'].includes(name)){
    weatherPreviewActive = false;
    if(state.data?.current) {
      document.body.className = codeTheme(state.data.current.weather_code, state.data.current.is_day);
      scene.theme = codeTheme(state.data.current.weather_code, !scene.night);
      applyVideo(scene.theme);
    }
    console.info('날씨 배경 미리보기를 종료하고 실제 날씨 배경으로 복원했습니다.');
    return;
  }
  const theme = WEATHER_PREVIEW_THEMES[name];
  if(!theme){
    console.warn('지원하지 않는 날씨 이름입니다. 사용 가능:', Object.keys(WEATHER_PREVIEW_THEMES).join(', '));
    return;
  }
  weatherPreviewActive = true;
  document.body.className = theme;
  scene.theme = theme;
  bg.style.opacity = '1';
  applyVideo(theme);
  console.info(`날씨 배경 미리보기: ${name} (${theme})`);
}
window.미리보기날씨 = previewWeatherBackground;
window.weatherPreview = previewWeatherBackground;

/* ---------- date helpers (string based, location-local) ---------- */
function parseLocal(s){ // "YYYY-MM-DDTHH:mm" or "YYYY-MM-DD"
  const [d,t='00:00'] = s.split('T');
  const [y,m,dd] = d.split('-').map(Number);
  const [h,mi] = t.split(':').map(Number);
  return new Date(Date.UTC(y,m-1,dd,h,mi));
}
function hourOpt(){ return settings.hour === '24' ? {hourCycle:'h23'} : settings.hour === '12' ? {hourCycle:'h12'} : {}; }
function fmtDay(s){
  return new Intl.DateTimeFormat(L().locale,{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}).format(parseLocal(s));
}
function fmtTime(s){
  return new Intl.DateTimeFormat(L().locale,{hour:'numeric',minute:'2-digit',timeZone:'UTC',...hourOpt()}).format(parseLocal(s));
}
function fmtHour(s){
  return new Intl.DateTimeFormat(L().locale,{hour:'numeric',timeZone:'UTC',...hourOpt()}).format(parseLocal(s));
}

/* ---------- rendering ---------- */
function render(){
  const t = L(); const d = state.data; if(!d) return;
  const c = d.current, h = d.hourly, dy = d.daily;
  const loc = state.loc;

  if(!weatherPreviewActive) document.body.className = codeTheme(c.weather_code, c.is_day);

  const countryNames = {
  KR: '대한민국',
  JP: '일본',
  US: '미국',
  CN: '중국',
  GB: '영국',
  FR: '프랑스',
  DE: '독일',
  CA: '캐나다',
  AU: '호주',
  IN: '인도',
  SG: '싱가포르',
  TW: '대만',
  HK: '홍콩',
  BR: '브라질',
  RU: '러시아',
  IT: '이탈리아',
  ES: '스페인',
  MX: '멕시코'
};

const parts = [loc.name, loc.admin]
  .map(v => (v || '').trim())
  .filter(Boolean)
  .filter((v, i, arr) => arr.findIndex(
    x => x.toLocaleLowerCase() === v.toLocaleLowerCase()
  ) === i);

const title = parts.length
  ? parts.join(', ')
  : (countryName(loc.country, countryNames[loc.country] || loc.country || ''));
  const todayHi = dy.temperature_2m_max[0], todayLo = dy.temperature_2m_min[0];

  // hourly: next 24 hours
  const nowKey = c.time.slice(0,13)+':00';
  let start = h.time.findIndex(x => x >= nowKey); if(start<0) start = 0;
  let hourlyHtml = '';
  for(let i=start;i<start+24 && i<h.time.length;i++){
    const hr = parseLocal(h.time[i]).getUTCHours();
    const isDay = hr>=6 && hr<19 ? 1 : 0;
    hourlyHtml += `<div class="hr">
      <div class="t">${i===start ? t.now : fmtHour(h.time[i])}</div>
      <div class="i">${codeIcon(h.weather_code[i], isDay)}</div>
      <div class="c">${tp(h.temperature_2m[i]).main}</div>
      <div class="f">${tp(h.temperature_2m[i]).sub}</div>
      <div class="p">💧${precipMain(h.precipitation[i] ?? 0)}</div>
    </div>`;
  }

  let dailyHtml = '';
  for(let i=0;i<dy.time.length;i++){
    const ps = dy.precipitation_sum[i] ?? 0;
    dailyHtml += `<div class="day">
      <div class="n">${i===0 ? t.today : fmtDay(dy.time[i])}</div>
      <div class="i">${codeIcon(dy.weather_code[i],1)}</div>
      <div class="d">${descOf(dy.weather_code[i])}<br>💧 ${precipStr(ps)}</div>
      <div class="r">${hiLo(dy.temperature_2m_max[i], dy.temperature_2m_min[i]).main}<br><small>${hiLo(dy.temperature_2m_max[i], dy.temperature_2m_min[i]).sub}</small></div>
    </div>`;

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function setStatus(msg){ $('app').innerHTML = `<div class="status">${escapeHtml(msg)}</div>`; }

/* ---------- data ---------- */
/* 날씨: MET Norway Locationforecast (API 키 불필요, 일일 호출 제한 없음).
   실패하면 Open-Meteo로 자동 전환합니다. 일출/일몰·체감온도 등은 브라우저에서 직접 계산/변환합니다. */
function browserTz(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; }catch(e){ return 'UTC'; } }

function localParts(ms, tz){
  const f = new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  const o = {}; for(const p of f.formatToParts(new Date(ms))) o[p.type] = p.value;
  if(o.hour === '24') o.hour = '00';
  return o;
}
function localISO(ms, tz){ const o = localParts(ms,tz); return `${o.year}-${o.month}-${o.day}T${o.hour}:${o.minute}`; }
function tzOffsetMs(ms, tz){
  const o = localParts(ms,tz);
  return Date.UTC(+o.year, +o.month-1, +o.day, +o.hour, +o.minute) - Math.floor(ms/60000)*60000;
}
function localToMs(ymd, hh, mm, tz){
  const [y,m,d] = ymd.split('-').map(Number);
  const base = Date.UTC(y,m-1,d,hh,mm); let g = base;
  for(let i=0;i<2;i++) g = base - tzOffsetMs(g,tz);
  return g;
}
function addDays(ymd, k){
  const [y,m,d] = ymd.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,d+k)).toISOString().slice(0,10);
}

/* 일출/일몰: 태양 위치 공식(NOAA 근사). noonMs = 그 지역 정오의 시각(ms) */
function sunTimes(lat, lon, noonMs){
  const rad = Math.PI/180, n = (noonMs - 946728000000)/86400000;
  const L = (((280.460 + 0.9856474*n) % 360) + 360) % 360;
  const g = (357.528 + 0.9856003*n) * rad;
  const lam = (L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * rad;
  const eps = (23.439 - 0.0000004*n) * rad;
  const dec = Math.asin(Math.sin(eps)*Math.sin(lam));
  const ra = Math.atan2(Math.cos(eps)*Math.sin(lam), Math.cos(lam)) / rad;
  const eot = (((L - ra + 540) % 360) - 180) * 4;                 // 분
  const cosH = (Math.sin(-0.833*rad) - Math.sin(lat*rad)*Math.sin(dec)) / (Math.cos(lat*rad)*Math.cos(dec));
  let noon = Math.floor(noonMs/86400000)*86400000 + (720 - 4*lon - eot)*60000;
  while(noon - noonMs > 43200000) noon -= 86400000;
  while(noonMs - noon > 43200000) noon += 86400000;
  if(cosH > 1)  return { polar:'night', noon };
  if(cosH < -1) return { polar:'day', noon };
  const H = Math.acos(cosH) / rad;
  return { rise: noon - H*4*60000, set: noon + H*4*60000, noon };
}

function metToWmo(code){
  const b = (code || '').replace(/_(day|night|polartwilight)$/, '');
  const heavy = b.startsWith('heavy'), light = b.startsWith('light');
  if(b.includes('thunder')) return 95;
  if(b.includes('snowshowers')) return heavy ? 86 : 85;
  if(b.includes('snow')) return heavy ? 75 : light ? 71 : 73;
  if(b.includes('sleet')) return light ? 66 : 67;
  if(b.includes('rainshowers')) return heavy ? 82 : light ? 80 : 81;
  if(b.includes('rain')) return heavy ? 65 : light ? 61 : 63;
  if(b === 'fog') return 45;
  if(b === 'partlycloudy') return 2;
  if(b === 'cloudy') return 3;
  if(b === 'fair') return 1;
  if(b === 'clearsky') return 0;
  return 3;
}
function apparentTemp(T, RH, ws){ // ws: m/s
  const e = RH/100 * 6.105 * Math.exp(17.27*T/(237.7+T));
  return T + 0.33*e - 0.70*ws - 4.00;
}

/* MET Norway 응답 → 화면이 쓰는 형태(현재/시간별/일별)로 변환 */
function metToShape(j, lat, lon, tz){
  const E = j.properties.timeseries.map(e => ({
    ms: Date.parse(e.time), i: e.data.instant.details,
    n1: e.data.next_1_hours, n6: e.data.next_6_hours, n12: e.data.next_12_hours
  }));
  const now = Date.now();
  let ci = 0; for(let k=0;k<E.length;k++){ if(E[k].ms <= now) ci = k; else break; }
  const symOf = e => (e.n1 && e.n1.summary && e.n1.summary.symbol_code) || (e.n6 && e.n6.summary && e.n6.summary.symbol_code) ||
                     (e.n12 && e.n12.summary && e.n12.summary.symbol_code) || 'cloudy';
  const amt = x => (x && x.details && x.details.precipitation_amount) || 0;
  const iso = ms => localISO(ms, tz);
  const today = iso(now).slice(0,10);
  const cur = E[ci];

  // 날짜별 집계
  const byDay = {};
  E.forEach((e,k) => {
    const next = E[k+1];
    const gap = next ? (next.ms - e.ms)/3600000 : (e.n1 ? 1 : 6);
    const p = gap <= 1 ? amt(e.n1) : (e.n6 ? amt(e.n6) : amt(e.n1));
    const t = iso(e.ms), day = t.slice(0,10), hr = +t.slice(11,13);
    const D = byDay[day] || (byDay[day] = {t:[], uv:[], p:0, codes:[], dcodes:[]});
    D.t.push(e.i.air_temperature);
    if(e.n6 && e.n6.details){
      if(e.n6.details.air_temperature_max != null) D.t.push(e.n6.details.air_temperature_max);
      if(e.n6.details.air_temperature_min != null) D.t.push(e.n6.details.air_temperature_min);
    }
    if(e.i.ultraviolet_index_clear_sky != null) D.uv.push(e.i.ultraviolet_index_clear_sky);
    D.p += p;
    const code = metToWmo(symOf(e)); D.codes.push(code); if(hr >= 8 && hr <= 20) D.dcodes.push(code);
  });
  const pick = arr => {
    if(!arr.length) return 3;
    if(arr.some(c => c >= 95)) return 95;
    const wet = arr.filter(c => c >= 51);
    const pool = wet.length*3 >= arr.length ? wet : arr, cnt = {};
    pool.forEach(c => cnt[c] = (cnt[c]||0) + 1);
    return +Object.keys(cnt).sort((a,b) => cnt[b]-cnt[a] || b-a)[0];
  };

  const daily = { time:[], weather_code:[], temperature_2m_max:[], temperature_2m_min:[], precipitation_sum:[],
                  precipitation_probability_max:[], sunrise:[], sunset:[], uv_index_max:[] };
  for(let k=0;k<7;k++){
    const day = addDays(today,k), D = byDay[day]; if(!D) break;
    const st = sunTimes(lat, lon, localToMs(day,12,0,tz));
    let sr, ss;
    if(st.rise){ sr = iso(st.rise); ss = iso(st.set); }
    else if(st.polar === 'day'){ sr = day+'T00:00'; ss = day+'T23:59'; }
    else { sr = ss = day+'T12:00'; }
    daily.time.push(day);
    daily.weather_code.push(pick(D.dcodes.length ? D.dcodes : D.codes));
    daily.temperature_2m_max.push(Math.max(...D.t));
    daily.temperature_2m_min.push(Math.min(...D.t));
    daily.precipitation_sum.push(D.p);
    daily.precipitation_probability_max.push(null);
    daily.sunrise.push(sr); daily.sunset.push(ss);
    daily.uv_index_max.push(D.uv.length ? Math.max(...D.uv) : 0);
  }

  // 시간별 (MET는 약 64시간까지 1시간 간격)
  const hourly = { time:[], temperature_2m:[], precipitation_probability:[], precipitation:[], weather_code:[] };
  for(let k=ci;k<E.length;k++){
    const e = E[k]; if(!e.n1) break;
    hourly.time.push(iso(e.ms)); hourly.temperature_2m.push(e.i.air_temperature);
    hourly.precipitation_probability.push(null); hourly.precipitation.push(amt(e.n1));
    hourly.weather_code.push(metToWmo(symOf(e)));
  }

  // 현재
  const st0 = sunTimes(lat, lon, localToMs(today,12,0,tz));
  const isDay = st0.rise ? ((now >= st0.rise && now <= st0.set) ? 1 : 0) : (st0.polar === 'day' ? 1 : 0);
  const T = cur.i.air_temperature, RH = cur.i.relative_humidity ?? 50, ws = cur.i.wind_speed ?? 0;
  return {
    current: {
      time: iso(now), temperature_2m: T, relative_humidity_2m: RH,
      apparent_temperature: cur.i.apparent_air_temperature ?? apparentTemp(T, RH, ws),
      is_day: isDay, precipitation: amt(cur.n1), weather_code: metToWmo(symOf(cur)),
      cloud_cover: cur.i.cloud_area_fraction ?? 0, pressure_msl: cur.i.air_pressure_at_sea_level ?? 1013,
      wind_speed_10m: ws*3.6, wind_direction_10m: cur.i.wind_from_direction
    },
    hourly, daily
  };
}

async function fetchMetJson(lat, lon, force){
  const la = (+lat).toFixed(4), lo = (+lon).toFixed(4), key = 'met:'+la+','+lo;   // MET는 소수점 4자리까지만 허용
  if(!force){ try{ const c = JSON.parse(sessionStorage.getItem(key) || 'null'); if(c && Date.now()-c.t < 300000) return c.j; }catch(e){} }
  const res = await fetch('https://api.met.no/weatherapi/locationforecast/2.0/complete?lat='+la+'&lon='+lo);
  if(!res.ok) throw new Error('met http '+res.status);
  const j = await res.json();
  if(!j.properties || !j.properties.timeseries || !j.properties.timeseries.length) throw new Error('met empty');
  try{ sessionStorage.setItem(key, JSON.stringify({t:Date.now(), j})); }catch(e){}
  return j;
}

async function fetchWeather(force){
  const loc = state.loc;
  let tz = loc.tz || browserTz();
  try{ new Intl.DateTimeFormat('en',{timeZone:tz}); }catch(e){ tz = browserTz(); }
  try{
    const j = await fetchMetJson(loc.lat, loc.lon, force);
    const d = metToShape(j, loc.lat, loc.lon, tz); d.provider = 'MET Norway'; return d;
  }catch(e){
    console.warn('MET Norway failed, falling back to Open-Meteo', e);
    const d = await fetchOpenMeteo(); d.provider = 'Open-Meteo'; return d;
  }
}

async function fetchOpenMeteo(){
  const { lat, lon } = state.loc;
  const url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m'+
    '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,uv_index_max'+
    '&timezone=auto&forecast_days=7';
  const res = await fetch(url);
  if(!res.ok) throw new Error('weather http '+res.status);
  return res.json();
}

async function reverseGeocode(lat, lon, lang){
  const url = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage='+(lang||'en');
  const res = await fetch(url);
  if(!res.ok) throw new Error('geo http');
  return res.json();
}

/* 현재 선택된 언어로 지역 이름을 다시 가져옵니다 (검색 결과·내 위치·언어 변경 모두 공통) */
async function localizeLoc(){
  const loc = state.loc; if(!loc) return;
  const lang = activeLang();
  if(loc.nameLang === lang) return;
  try{
    if(loc.id){
      const res = await fetch('https://geocoding-api.open-meteo.com/v1/get?id='+loc.id+'&language='+lang);
      if(res.ok){
        const r = await res.json();
        const nk = loc.nameKey || 'name', ak = loc.areaKeys || ['admin1'];
        const nm = r && r[nk];
        if(nm){ loc.name = nm; loc.admin = uniq(ak.map(k => r[k]).filter(v => v && v !== nm)).join(', '); }
      }
    } else {
      const g = await reverseGeocode(loc.lat, loc.lon, lang);
      const nm = g.city || g.locality || g.principalSubdivision;
      if(nm){ loc.name = nm; loc.admin = (g.city || g.locality) ? (g.principalSubdivision || '') : ''; }
    }
    loc.nameLang = lang;
  }catch(e){ console.warn('Localizing location name failed', e); }
}

function saveLoc(loc){ safeSet('weather_loc', JSON.stringify(loc)); }
function savedLoc(){
  try{ const o = JSON.parse(safeGet('weather_loc') || 'null'); return o && Number.isFinite(o.lat) && Number.isFinite(o.lon) ? o : null; }catch(e){ return null; }
}
async function loadLocation(loc, opts={}){
  state.loc = loc;
  state.lang = langForCountry(loc.country);
  applyStaticText();
  setStatus(L().loading);
  setNote(opts.note || '');
  try{
    await localizeLoc();
    if(opts.save) saveLoc(loc);
    state.data = await fetchWeather();
    lastWeatherAt = Date.now();
    render();
    updateScene();
  }catch(e){
    console.error(e);
    setStatus(L().error);
  }
}

async function locate(){
  const lang = state.manualLang || state.lang || 'ko';
  setStatus(I18N[lang].locating);
  setNote('');

  // 브라우저 위치 권한이 없거나 file:// 등 보안 컨텍스트가 아닌 경우
  // IP 기반 대략 위치를 시도한 뒤, 그것도 실패하면 서울을 표시합니다.
  const useFallback = async () => {
    try{
      const res = await fetch('https://ipapi.co/json/', { cache:'no-store' });
      if(!res.ok) throw new Error('IP location HTTP ' + res.status);
      const g = await res.json();
      const lat = Number(g.latitude), lon = Number(g.longitude);
      if(!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error('IP location coordinates missing');
      const cc = (g.country_code || '').toUpperCase();
      const loc = {
        lat, lon,
        name: g.city || g.region || `${lat.toFixed(2)}, ${lon.toFixed(2)}`,
        admin: g.region || '',
        country: cc,
        tz: g.timezone || browserTz()
      };
      await loadLocation(loc, {note: lang==='ko'
        ? '브라우저 위치를 사용할 수 없어 IP 기반 대략적인 위치를 표시합니다.'
        : 'Browser location unavailable; showing an approximate IP-based location.'});
    }catch(err){
      console.warn('IP location failed; using default location.', err);
      await loadLocation(DEFAULT_LOC, {note:I18N[state.manualLang || 'ko'].fallback});
    }
  };

  if(!navigator.geolocation){
    await useFallback();
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      let loc = { lat, lon, name:`${lat.toFixed(2)}, ${lon.toFixed(2)}`, admin:'', country:'', tz:browserTz() };
      try{
        const g1 = await reverseGeocode(lat, lon, 'en');
        const cc = g1.countryCode || '';
        const language = state.manualLang || langForCountry(cc);
        let g = g1;
        if(language !== 'en'){
          try{ g = await reverseGeocode(lat, lon, language); }catch(e){ console.warn('Localized reverse geocode failed', e); }
        }
        loc = {
          lat, lon,
          name: g.city || g.locality || g.principalSubdivision || loc.name,
          admin: (g.city || g.locality) ? (g.principalSubdivision || '') : '',
          country: cc,
          tz: browserTz()
        };
      }catch(e){ console.warn('Reverse geocoding failed; showing coordinates.', e); }
      await loadLocation(loc);
    }catch(err){
      console.error('Location processing failed:', err);
      await useFallback();
    }
  }, async err=>{
    console.warn('Browser geolocation failed:', err && {code:err.code, message:err.message});
    await useFallback();
  }, { enableHighAccuracy:false, timeout:12000, maximumAge:600000 });
}

let searchTimer = null;
$('q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  clearTimeout(searchTimer);
  if(v.length<2){ $('results').style.display='none'; return; }
  searchTimer = setTimeout(()=>doSearch(v), 300);

/* 검색 범위(설정): city = 시·군, district = 구 포함, all = 읍·면·동 등 전체
   Open-Meteo(GeoNames)는 구·동을 별도 분류 코드로 구분하지 않아서, 이름(…구/…区/…-gu)과 행정구역 필드로 판별합니다. */
const GU_RE = /(구|区|[-\s]gu)$/i;
const sameName = (a,b) => !!a && !!b && String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
const uniq = a => a.filter((v,i) => v && a.indexOf(v) === i);
const byPop = (a,b) => (b.population || 0) - (a.population || 0);
function isCityRec(r){
  if(GU_RE.test(r.name || '')) return false;
  return /^(PPLC|PPLA|PPLA2)$/.test(r.feature_code || '') || sameName(r.name, r.admin2);
}
function isGuRec(r){
  return GU_RE.test(r.name || '') && (/^(PPLA2|PPLA3)$/.test(r.feature_code || '') || sameName(r.name, r.admin2) || sameName(r.name, r.admin3));
}
function buildItems(list){
  const lv = settings.level, out = [], seen = new Set();
  const mk = (r, nameKey, areaKeys) => Object.assign({}, r, {
    nameKey, areaKeys, label: r[nameKey],
    area: uniq(areaKeys.map(k => r[k]).filter(v => v && v !== r[nameKey]))
  });
  const add = it => {
    const key = [it.country_code, it.admin1, it.admin2, it.label].join('|').toLowerCase();
    if(!seen.has(key)){ seen.add(key); out.push(it); }
  };
  if(lv === 'all'){
    list.forEach(r => add(mk(r, 'name', ['admin2','admin1'])));
    return out.slice(0, settings.max);
  }
  const sorted = list.slice().sort(byPop);
  sorted.forEach(r => { if(isCityRec(r)) add(mk(r, 'name', ['admin1'])); });
  if(lv === 'district'){
    sorted.forEach(r => {
      if(isCityRec(r)) return;
      if(isGuRec(r)) add(mk(r, 'name', ['admin2','admin1']));
      else if(GU_RE.test(r.admin2 || '')) add(mk(r, 'admin2', ['admin1']));       // 서울 등: 동 → 소속 구
      else if(GU_RE.test(r.admin3 || '')) add(mk(r, 'admin3', ['admin2','admin1'])); // 청주시 서원구 등
    });
  }
  return out.slice(0, settings.max);
}
function countryName(cc, fallback){
  try{ if(cc) return new Intl.DisplayNames([L().locale],{type:'region'}).of(cc.toUpperCase()) || fallback; }catch(e){}
  return fallback || '';
}
/* Open-Meteo는 2글자 검색어는 이름이 정확히 같아야만 찾고(3글자 이상부터 유사 검색), 한·중·일 이름은 3글자여도 접미사가 빠지면 못 찾습니다.
   예) "서울"·"서울시" 0건 → "서울특별시"만 나옴. 그래서 언어별로 행정구역 접미사를 붙인 후보도 함께 검색해서 합칩니다. */
const SUFFIX_SETS = [
  { test:/[가-힣]/, strip:/(특별자치시|특별자치도|특별시|광역시|시|군|도)$/, add:['특별시','광역시','특별자치시','특별자치도','시','군','도'] },
  { test:/[぀-ヿ]/, strip:/(都|道|府|県|市|区|町|村|郡)$/, add:['都','道','府','県','市','区','町','郡'] },   // 일본어(가나 포함)
  { test:/[一-鿿]/, strip:/(特别行政区|自治区|省|市|县|縣|区|區|都|府|道|郡)$/, add:['市','省','县','區','区','都','府','道','縣','郡'] } // 한자(중국어·일본어)
];
const ALIASES = { la:'Los Angeles', ny:'New York', nyc:'New York', sf:'San Francisco', dc:'Washington', hk:'Hong Kong', kl:'Kuala Lumpur', bj:'Beijing', sh:'Shanghai', sg:'Singapore', ba:'Buenos Aires', rj:'Rio de Janeiro' };
function searchVariants(v){
  const out = [v];
  for(const set of SUFFIX_SETS){
    if(!set.test.test(v)) continue;
    const base = v.replace(set.strip, '') || v;
    if(base !== v) out.push(base);
    set.add.forEach(sf => out.push(base + sf));
    break;
  }
  const al = ALIASES[v.toLowerCase()];     // 2글자 영문 약칭(유사 검색 불가)
  if(al) out.push(al);
  return uniq(out).slice(0, 12);
}
async function doSearch(v){
  const box = $('results');
  try{
    const lang = activeLang();
    const count = settings.level === 'all' ? Math.max(settings.max, 10) : 100;
    const lists = await Promise.all(searchVariants(v).map((q,qi) =>
      fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count='+(qi === 0 ? count : 20)+'&language='+lang)
        .then(r => r.ok ? r.json() : {}).then(j => j.results || []).catch(() => [])));
    if($('q').value.trim() !== v) return;   // 그 사이 입력이 바뀌었으면 무시
    const seenIds = new Set(), merged = [];
    lists.flat().forEach(r => { if(!seenIds.has(r.id)){ seenIds.add(r.id); merged.push(r); } });
    const items = buildItems(merged);
    if(!items.length){ box.innerHTML = `<div>${escapeHtml(L().noResult)}</div>`; box.style.display='block'; return; }
    box.innerHTML = items.map((r,i)=>
      `<div data-i="${i}">${escapeHtml(r.label)} <small>${escapeHtml([...r.area, countryName(r.country_code, r.country)].filter(Boolean).join(', '))}</small></div>`).join('');
    box.style.display='block';
    box.querySelectorAll('div').forEach(el=>{
      el.addEventListener('click',()=>{
        const r = items[+el.dataset.i]; if(!r) return;
        box.style.display='none'; $('q').value='';
        loadLocation({ lat:r.latitude, lon:r.longitude, name:r.label, admin:r.area.join(', '), country:r.country_code||'', tz:r.timezone||browserTz(),
                       id:r.id, nameLang:lang, nameKey:r.nameKey, areaKeys:r.areaKeys }, {save:true});
      });
    });
  }catch(e){ box.style.display='none'; }
}
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) $('results').style.display='none'; });

/* ---------- 배경 장면 엔진 (실시간 생성 애니메이션) ---------- */
/* 실제 촬영 영상을 쓰고 싶으면 아래에 mp4/webm 주소를 넣으세요. 비워두면 코드로 만든 애니메이션이 재생됩니다. */
const VIDEO_SOURCES = {
  'clear-day':'', 'clear-night':'', 'cloudy':'', 'fog':'', 'rain':'', 'snow':'', 'storm':''
};
const RAIN_I = {5:.25,6:.3,7:.4,8:.7,9:1,10:.55,15:.7,16:1,18:.9,19:1};
const SNOW_I = {11:.35,12:.7,13:1,14:.4,17:.7};

const bg = $('bg'), ctx = bg.getContext('2d'), bvid = $('bgVideo');
let W = 0, H = 0;
const scene = { theme:'clear-day', night:false, alt:.6, sunP:.5, moonQ:.5, rise:360, set:1080, clock:720, clockAt:0, validSun:true, cover:20, wind:8, rain:0, snow:0, thunder:false,
  sprites:[], clouds:[], stars:[], drops:[], flakes:[], t:0, flash:0, flick:0, bolt:null, nextBolt:3, shoot:null, nextShoot:6 };
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp01 = v => Math.max(0, Math.min(1, v));
const smooth = (a,b,v) => { const t = clamp01((v-a)/(b-a)); return t*t*(3-2*t); };
const hex2rgb = h => { const n = parseInt(h.slice(1),16); return [(n>>16)&255, (n>>8)&255, n&255]; };
const mixRgb = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const mixPal = (p1,p2,t) => p1.map((c,i)=>mixRgb(c,p2[i],t));
const rgbStr = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const PAL = o => o.map(hex2rgb);

/* 태양 고도(alt): 낮 = 0(일출)→1(정오)→0(일몰), 밤 = 0(일몰)→-1(자정)→0(일출) */
const CLEAR_STOPS = [
  [-1,   PAL(['#02050f','#060c20','#0e1a3d'])],   // 한밤
  [-.35, PAL(['#0a1230','#18214a','#2f3466'])],   // 깊은 황혼
  [-.12, PAL(['#252f63','#7d4a85','#d77f6a'])],   // 박명(새벽·저녁 보랏빛)
  [0,    PAL(['#3a3f86','#d0698a','#ffa860'])],   // 일출·일몰 붉은 하늘
  [.15,  PAL(['#3f66b0','#d99a82','#ffd09a'])],   // 골든아워(아침·늦은 오후)
  [.4,   PAL(['#3478c8','#78b4e6','#f0dcc0'])],   // 오전·오후
  [.7,   PAL(['#2a7ad2','#62b2f0','#bfe2f9'])],
  [1,    PAL(['#1c68c8','#4aa0ea','#a4d6f8'])]    // 한낮
];
function clearPalette(alt){
  for(let i=1;i<CLEAR_STOPS.length;i++){
    if(alt <= CLEAR_STOPS[i][0]){
      const [a0,p0] = CLEAR_STOPS[i-1], [a1,p1] = CLEAR_STOPS[i];
      return mixPal(p0, p1, (alt-a0)/(a1-a0));
    }
  }
  return CLEAR_STOPS[CLEAR_STOPS.length-1][1];
}
const WEATHER_PAL = { // [낮, 밤]
  cloudy:[PAL(['#667585','#919eac','#bfc9d2']), PAL(['#161b25','#252d3b','#364152'])],
  fog:   [PAL(['#98a3ac','#b6bfc6','#d3d9de']), PAL(['#1f262e','#323d49','#485664'])],
  rain:  [PAL(['#38444f','#55636f','#76848f']), PAL(['#0d1219','#18212c','#262f3c'])],
  snow:  [PAL(['#8398ad','#adbfd0','#dbe5ee']), PAL(['#1c2736','#33455a','#51657c'])],
  storm: [PAL(['#1c1a2a','#35304f','#544c70']), PAL(['#0b0a14','#181528','#2a2540'])]
};
function skyColors(){
  const s = scene;
  let pal;
  if(s.theme.startsWith('clear')) pal = clearPalette(s.alt);
  else {
    const [day,night] = WEATHER_PAL[s.theme] || WEATHER_PAL.cloudy;
    pal = mixPal(night, day, smooth(-.2,.35,s.alt));
    const warm = Math.max(0, 1 - Math.abs(s.alt)/.25) * (s.theme==='storm' ? .15 : .3);
    if(warm > 0) pal = mixPal(pal, PAL(['#6a4a6e','#c9766f','#f0a064']), warm);
  }
  return pal.map(rgbStr);
}
function cloudTint(){
  const s = scene, th = s.theme, k = smooth(-.2,.35,s.alt);
  const mix4 = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t, a[3]+(b[3]-a[3])*t];
  const T = {
    clear:[[70,84,120,.45],[255,255,255,.6]], cloudy:[[78,88,110,.6],[214,221,228,.65]],
    fog:[[110,124,138,.35],[225,231,235,.4]], rain:[[44,52,66,.75],[96,108,122,.75]],
    snow:[[120,138,160,.5],[238,243,248,.55]], storm:[[40,36,58,.85],[62,58,84,.85]]
  };
  let c = mix4(T[th.startsWith('clear') ? 'clear' : th][0], T[th.startsWith('clear') ? 'clear' : th][1], k);
  const warm = Math.max(0, 1 - Math.abs(s.alt)/.25);
  if(warm > 0 && th !== 'storm') c = mix4(c, [255,176,150,Math.max(c[3],.6)], warm*.75);
  return c;
}
function makeCloudSprite(tint){
  const [r,g,b,a] = tint;
  const c = document.createElement('canvas'); c.width = 640; c.height = 280;
  const x = c.getContext('2d'), puffs = [];
  for(let i=0;i<22;i++){
    const px = 140 + Math.random()*360;
    puffs.push([px, 150 + Math.random()*50 - Math.abs(px-320)/360*40, 40 + Math.random()*60]);
  }
  for(let i=0;i<8;i++) puffs.push([100 + Math.random()*440, 185 + Math.random()*25, 40 + Math.random()*30]);
  for(const [px,py,pr] of puffs){
    const gr = x.createRadialGradient(px,py,0,px,py,pr);
    gr.addColorStop(0, `rgba(${r},${g},${b},${a})`);
    gr.addColorStop(.55, `rgba(${r},${g},${b},${a*.55})`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr; x.beginPath(); x.arc(px,py,pr,0,7); x.fill();
  }
  return c;
}
let flakeSprite = null;
let tintKey = '';
function makeFlakeSprite(){
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d'), g = x.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,255,255,.7)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0,0,32,32);
  return c;
}

function resizeBg(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  bg.width = Math.round(W*dpr); bg.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function buildScene(){
  const s = scene, th = s.theme, mobile = W < 700;
  const tint = cloudTint();
  s.sprites = [makeCloudSprite(tint), makeCloudSprite(tint), makeCloudSprite(tint)];
  tintKey = s.theme + Math.round(s.alt*10);
  if(!flakeSprite) flakeSprite = makeFlakeSprite();

  const n = th.startsWith('clear') ? Math.round(s.cover/100*8) : ({cloudy:10,rain:11,storm:12,snow:9,fog:5}[th] || 6);
  s.clouds = [];
  for(let i=0;i<n;i++){
    const layer = Math.random(), big = th==='fog' ? 2.2 : 1;
    s.clouds.push({
      sp: s.sprites[i%3],
      x: Math.random()*(W+500) - 300,
      y: (th==='fog' ? .35 + Math.random()*.6 : Math.random()*.5) * H * (1 - .3*layer) - 40,
      w: (mobile?360:560) * (.7 + layer*.9) * big,
      v: (3 + layer*9) * (.5 + s.wind/25),
      a: .55 + layer*.45
    });
  }

  s.stars = [];
  if(th.startsWith('clear')){
    const cnt = Math.round((mobile?160:320) * (1 - s.cover/130));
    for(let i=0;i<cnt;i++) s.stars.push({x:Math.random()*W, y:Math.random()*H*.8, r:.4+Math.random()*1.2, p:Math.random()*6.28, sp:.6+Math.random()*2});
  }

  s.drops = [];
  const dn = Math.round(s.rain * (mobile?280:560));
  for(let i=0;i<dn;i++) s.drops.push({x:Math.random()*W, y:Math.random()*H, len:10+Math.random()*18, v:600+Math.random()*500});

  s.flakes = [];
  const fn = Math.round(s.snow * (mobile?150:320));
  for(let i=0;i<fn;i++) s.flakes.push({x:Math.random()*W, y:Math.random()*H, r:2+Math.random()*7, v:30+Math.random()*60, sw:Math.random()*6.28, a:.5+Math.random()*.5});
}

/* 배경의 시각은 내 컴퓨터(기기)의 현재 시간을 그대로 따라갑니다. (weather.html?hour=18 미리보기는 그 시각에서 흘러감) */
function deviceMin(){ const n = new Date(); return n.getHours()*60 + n.getMinutes() + n.getSeconds()/60; }
function currentMin(){ return scene.fixedClock ? scene.clock + (performance.now() - scene.clockAt)/60000 : deviceMin(); }
function updateSun(){
  const s = scene;
  if(!s.validSun){ s.alt = s.night ? -.8 : .8; s.sunP = .5; s.moonQ = .5; return; }
  let m = currentMin(); m = ((m % 1440) + 1440) % 1440;
  const rise = s.rise, set = s.set;
  if(m >= rise && m <= set){
    s.sunP = (m-rise)/(set-rise); s.alt = Math.sin(Math.PI*s.sunP); s.night = false; s.moonQ = 0;
  } else {
    const nightLen = (1440-set) + rise, el = m > set ? m-set : m+1440-set;
    s.moonQ = clamp01(el/nightLen); s.alt = -Math.sin(Math.PI*s.moonQ); s.night = true;
  }
}
function refreshTint(){
  const key = scene.theme + Math.round(scene.alt*10);
  if(key === tintKey) return;
  tintKey = key;
  const t = cloudTint();
  scene.sprites = [makeCloudSprite(t), makeCloudSprite(t), makeCloudSprite(t)];
  scene.clouds.forEach((c,i)=>{ c.sp = scene.sprites[i%3]; });
}

function sceneSig(){ const s = scene; return [s.theme, s.rain, s.snow, s.thunder, Math.round(s.cover/20), Math.round(s.wind/10)].join('|'); }
function updateScene(soft){
  const d = state.data; if(!d) return;
  const prevSig = sceneSig();
  const c = d.current, dy = d.daily, idx = codeIndex(c.weather_code);
  const mins = s => { const t = s.split('T')[1].split(':'); return (+t[0])*60 + (+t[1]); };
  const hp = new URLSearchParams(location.search).get('hour'); // 미리보기: weather.html?hour=18
  const rise = mins(dy.sunrise[0]), set = mins(dy.sunset[0]);
  Object.assign(scene, {
    rise, set, validSun: set > rise,
    fixedClock: (hp !== null && hp !== '' && !isNaN(+hp)),
    clock: (hp !== null && hp !== '' && !isNaN(+hp)) ? (+hp)*60 : deviceMin(),
    clockAt: performance.now(),
    night: !c.is_day,
    cover: c.cloud_cover || 0,
    wind: c.wind_speed_10m || 0,
    rain: RAIN_I[idx] || 0,
    snow: SNOW_I[idx] || 0,
    thunder: idx >= 18
  });
  updateSun();
  if(!weatherPreviewActive) scene.theme = codeTheme(c.weather_code, !scene.night);
  if(soft){
    // 자동 갱신: 날씨 종류가 바뀐 경우에만 장면을 다시 만들고, 아니면 구름·비·눈이 끊기지 않게 그대로 둡니다.
    if(sceneSig() !== prevSig){ buildScene(); applyVideo(scene.theme); }
    return;
  }
  bg.style.opacity = '0';
  buildScene();
  applyVideo(scene.theme);
  requestAnimationFrame(()=>{ bg.style.opacity = '1'; });
}

/* ---------- 실시간 자동 갱신 ----------
   시간(해·달 위치, 하늘색)은 1초마다 계산되고, 날씨 데이터는 5분마다·탭으로 돌아올 때 새로 받아 배경에 반영합니다. */
let lastWeatherAt = Date.now(), refreshing = false;
async function refreshWeather(){
  if(refreshing || !state.loc || !state.data) return;
  refreshing = true;
  try{
    const d = await fetchWeather(true);
    state.data = d; lastWeatherAt = Date.now();
    render();
    updateScene(true);
  }catch(e){ console.warn('Auto refresh failed', e); }
  finally{ refreshing = false; }
}
const REFRESH_MS = 300000;   // 5분
setInterval(()=>{ if(!document.hidden && Date.now() - lastWeatherAt >= REFRESH_MS) refreshWeather(); }, 15000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && Date.now() - lastWeatherAt >= REFRESH_MS) refreshWeather(); });
window.addEventListener('online', ()=>{ refreshWeather(); });

function applyVideo(theme){
  const src = VIDEO_SOURCES[theme];
  if(src){
    if(bvid.getAttribute('src') !== src) bvid.src = src;
    bvid.style.display = 'block'; bg.style.display = 'none';
    bvid.play().catch(()=>{});
  } else {
    bvid.pause(); bvid.removeAttribute('src'); bvid.style.display = 'none'; bg.style.display = 'block';
  }
}
bvid.addEventListener('error', ()=>{ bvid.style.display = 'none'; bg.style.display = 'block'; });

function drawSky(){
  const [a,b,c] = skyColors();
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,a); g.addColorStop(.55,b); g.addColorStop(1,c);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}
function drawCelestial(){
  const s = scene, th = s.theme, clear = th.startsWith('clear');
  const arcX = p => W*(.1 + .8*p), arcY = p => H*(.74 - .42*Math.sin(Math.PI*p));
  if(!s.night && (clear || th === 'cloudy')){
    const x = arcX(s.sunP), y = arcY(s.sunP);
    const low = 1 - smooth(0,.5,s.alt), ga = clear ? 1 : .4;
    const R = Math.min(W,H) * (.65 + .3*low) * (clear ? 1 : .75);
    const core = mixRgb([255,248,220],[255,160,90],low).map(Math.round);
    const mid  = mixRgb([255,236,170],[255,130,80],low).map(Math.round);
    const g = ctx.createRadialGradient(x,y,0,x,y,R);
    g.addColorStop(0, `rgba(${core},${.9*ga})`);
    g.addColorStop(.12, `rgba(${mid},${.45*ga})`);
    g.addColorStop(1, `rgba(${mid},0)`);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    if(clear){
      const disc = mixRgb([255,251,232],[255,190,120],low).map(Math.round);
      ctx.fillStyle = `rgb(${disc})`;
      ctx.beginPath(); ctx.arc(x,y,(36+14*low)*(1+Math.sin(s.t*.8)*.03),0,7); ctx.fill();
    }
  } else if(s.night && (clear || th === 'cloudy')){
    const x = arcX(s.moonQ), y = arcY(s.moonQ);
    ctx.globalAlpha = clamp01(-s.alt/.2) * (clear ? 1 : .3);
    const R = Math.min(W,H)*.45;
    const g = ctx.createRadialGradient(x,y,0,x,y,R);
    g.addColorStop(0,'rgba(200,215,255,.45)'); g.addColorStop(.2,'rgba(160,180,240,.15)'); g.addColorStop(1,'rgba(120,140,220,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#f3f1e6'; ctx.beginPath(); ctx.arc(x,y,32,0,7); ctx.fill();
    ctx.fillStyle = 'rgba(170,170,160,.35)';
    [[-9,-6,7],[8,5,5],[-4,11,4],[10,-10,3]].forEach(([dx,dy,r])=>{ ctx.beginPath(); ctx.arc(x+dx,y+dy,r,0,7); ctx.fill(); });
    ctx.globalAlpha = 1;
  }
}
function drawStars(dt){
  const s = scene; if(!s.stars.length) return;
  const k = clamp01((-s.alt - .04)/.3);
  if(k <= 0) return;
  ctx.fillStyle = '#fff';
  for(const st of s.stars){
    ctx.globalAlpha = (.35 + .65*(.5 + .5*Math.sin(s.t*st.sp + st.p))) * k;
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if(k > .9){
    if(!s.shoot && s.t > s.nextShoot){
      s.shoot = {x:Math.random()*W*.8, y:Math.random()*H*.35, vx:500+Math.random()*300, vy:220+Math.random()*120, life:1};
      s.nextShoot = s.t + 8 + Math.random()*8;
    }
    if(s.shoot){
      const sh = s.shoot, g = ctx.createLinearGradient(sh.x,sh.y,sh.x-sh.vx*.12,sh.y-sh.vy*.12);
      g.addColorStop(0,`rgba(255,255,255,${sh.life})`); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.beginPath();
      ctx.moveTo(sh.x,sh.y); ctx.lineTo(sh.x-sh.vx*.12, sh.y-sh.vy*.12); ctx.stroke();
      sh.x += sh.vx*dt; sh.y += sh.vy*dt; sh.life -= dt*1.4;
      if(sh.life <= 0) s.shoot = null;
    }
  }
}
function drawClouds(dt){
  for(const c of scene.clouds){
    c.x += c.v*dt;
    if(c.x > W + 50) c.x = -c.w;
    ctx.globalAlpha = c.a;
    ctx.drawImage(c.sp, c.x, c.y, c.w, c.w*.4375);
  }
  ctx.globalAlpha = 1;
  if(scene.theme === 'fog'){
    ctx.fillStyle = scene.night ? 'rgba(80,92,104,.25)' : 'rgba(215,221,226,.28)';
    ctx.fillRect(0,0,W,H);
  }
}
function drawRain(dt){
  const s = scene; if(!s.drops.length) return;
  const slant = Math.min(s.wind/40, 1) * .6 + .08;
  ctx.strokeStyle = s.night ? 'rgba(170,190,220,.32)' : 'rgba(205,218,235,.4)';
  ctx.lineWidth = 1.1; ctx.beginPath();
  for(const d of s.drops){
    d.y += d.v*dt; d.x += d.v*dt*slant;
    if(d.y > H){ d.y = -d.len; d.x = Math.random()*(W+200) - 100; }
    if(d.x > W+100) d.x -= W+200;
    ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - slant*d.len, d.y - d.len);
  }
  ctx.stroke();
  const g = ctx.createLinearGradient(0,H*.8,0,H);
  g.addColorStop(0,'rgba(200,210,225,0)'); g.addColorStop(1,'rgba(200,210,225,.18)');
  ctx.fillStyle = g; ctx.fillRect(0,H*.8,W,H*.2);
}
function drawSnow(dt){
  const s = scene; if(!s.flakes.length) return;
  const drift = Math.min(s.wind,40)*.8;
  for(const f of s.flakes){
    f.y += f.v*dt;
    f.x += (Math.sin(s.t*.8 + f.sw)*20 + drift)*dt;
    if(f.y > H + 10){ f.y = -10; f.x = Math.random()*W; }
    if(f.x > W + 10) f.x = -10; else if(f.x < -10) f.x = W + 10;
    ctx.globalAlpha = f.a;
    ctx.drawImage(flakeSprite, f.x - f.r, f.y - f.r, f.r*2, f.r*2);
  }
  ctx.globalAlpha = 1;
}
function makeBolt(){
  const s = scene; let x = W*(.15 + Math.random()*.7), y = 0;
  const main = [[x,y]], segs = [], maxY = H*(.55 + Math.random()*.3);
  while(y < maxY){
    y += 20 + Math.random()*30; x += (Math.random()-.5)*50; main.push([x,y]);
    if(Math.random() < .12){
      let bx = x, by = y; const br = [[bx,by]];
      for(let k=0;k<5;k++){ by += 15 + Math.random()*20; bx += (Math.random()-.3)*40; br.push([bx,by]); }
      segs.push({pts:br, w:1.2});
    }
  }
  segs.push({pts:main, w:2.6});
  s.bolt = segs; s.flash = 1; s.flick = 1 + Math.floor(Math.random()*2);
}
function drawLightning(dt){
  const s = scene; if(!s.thunder) return;
  if(s.t > s.nextBolt){ makeBolt(); s.nextBolt = s.t + 2.5 + Math.random()*7; }
  if(s.flash > 0){
    ctx.fillStyle = `rgba(215,222,255,${s.flash*.32})`; ctx.fillRect(0,0,W,H);
    if(s.bolt){
      ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(170,185,255,1)'; ctx.shadowBlur = 24;
      ctx.strokeStyle = `rgba(255,255,255,${Math.min(1, s.flash*1.4)})`;
      for(const seg of s.bolt){
        ctx.lineWidth = seg.w; ctx.beginPath(); ctx.moveTo(seg.pts[0][0], seg.pts[0][1]);
        for(let i=1;i<seg.pts.length;i++) ctx.lineTo(seg.pts[i][0], seg.pts[i][1]);
        ctx.stroke();
      }
      ctx.restore();
    }
    s.flash -= dt*2.4;
    if(s.flash <= 0){
      if(s.flick > 0){ s.flick--; s.flash = .7; } else { s.flash = 0; s.bolt = null; }
    }
  }
}
function drawVignette(){
  const g = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.35)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}

let lastTs = 0, lastTick = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if(document.hidden || bg.style.display === 'none'){ lastTs = ts; return; }
  const dt = (reduceMotion || !settings.anim) ? 0 : Math.min((ts - lastTs)/1000 || 0, .05);
  lastTs = ts; scene.t += dt;
  if(ts - lastTick > 1000){ lastTick = ts; updateSun(); refreshTint(); }
  drawSky(); drawCelestial(); drawStars(dt); drawClouds(dt);
  drawRain(dt); drawSnow(dt); drawLightning(dt); drawVignette();
}

let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{ resizeBg(); buildScene(); }, 200);
});
resizeBg(); buildScene(); bg.style.opacity = '1'; requestAnimationFrame(frame);

/* ---------- 상단 미니 위젯 ---------- */
/* 웹페이지는 카메라 구멍(다이나믹 아일랜드) 자체를 제어할 수 없어서, 그 위치에 맞춰 검은 알약 모양 위젯을 겹쳐 그립니다.
   홈 화면에 추가한 웹앱(PWA)처럼 상태바 영역까지 화면이 그려질 때 가장 자연스럽게 보입니다. */
const UA = navigator.userAgent || '';
const IS_IPHONE = /iPhone/.test(UA);
const IS_GALAXY = /SAMSUNG|SM-[A-Z0-9]+|SamsungBrowser/i.test(UA);
function safeTopPx(){
  const p = document.createElement('div');
  p.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)';
  document.body.appendChild(p);
  const v = parseFloat(getComputedStyle(p).paddingTop) || 0;
  p.remove(); return v;
}
function miniMode(){
  if(settings.widget === 'off') return null;
  if(IS_IPHONE) return safeTopPx() >= 54 ? 'island' : 'topcenter';
  if(IS_GALAXY) return 'topleft';
  return settings.widget === 'on' ? 'topleft' : null;
}
function updateMini(){
  if(typeof pip !== 'undefined' && pip.on) pipDraw();
  const el = $('miniW'), d = state.data, mode = d ? miniMode() : null;
  document.body.classList.remove('mini-island','mini-flow');
  if(!mode){ el.style.display = 'none'; return; }
  const c = d.current, icon = codeIcon(c.weather_code, c.is_day), temp = tp(c.temperature_2m).main;
  el.className = mode;
  el.innerHTML = mode === 'island'
    ? `<span class="mi">${icon}</span><span class="gap"></span><span>${temp}</span>`
    : `<span class="mi">${icon}</span><span>${temp}</span><span class="mn">${escapeHtml((state.loc && state.loc.name) || '')}</span>`;
  el.style.display = 'flex';
  document.body.classList.add(mode === 'island' ? 'mini-island' : 'mini-flow');
}
window.addEventListener('orientationchange', () => setTimeout(updateMini, 300));

/* ---------- PiP (떠 있는 작은 창) ----------
   날씨 카드를 canvas에 그려 video로 만든 뒤 Picture-in-Picture로 띄웁니다.
   데스크톱·안드로이드 크롬·iOS 사파리에서 쓸 수 있고, 다른 앱으로 이동해도 작은 창이 남습니다.
   (브라우저/페이지를 완전히 종료하면 사라집니다.) */
const pip = { cv:null, ctx:null, vid:null, on:false, timer:null };
function pipSupported(){
  const v = document.createElement('video');
  return !!((document.pictureInPictureEnabled && v.requestPictureInPicture) || typeof v.webkitSetPresentationMode === 'function');
}
function pipDraw(){
  if(!pip.cv) return;
  const x = pip.ctx, w = pip.cv.width, h = pip.cv.height, d = state.data, t = L();
  const [a,b,c2] = skyColors();
  const g = x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,a); g.addColorStop(.55,b); g.addColorStop(1,c2);
  x.fillStyle = g; x.fillRect(0,0,w,h);
  x.fillStyle = 'rgba(0,0,0,.28)'; x.fillRect(0,0,w,h);
  if(!d){ x.fillStyle = '#fff'; x.font = '600 36px sans-serif'; x.fillText(t.loading, 30, 130); return; }
  const cur = d.current, dy = d.daily, loc = state.loc || {};
  const font = '"Figtree","Noto Sans KR","Noto Sans JP","Noto Sans SC","Noto Sans",-apple-system,"Segoe UI",Roboto,sans-serif';
  x.fillStyle = '#fff'; x.textBaseline = 'alphabetic';
  x.font = '96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  x.fillText(codeIcon(cur.weather_code, cur.is_day), 24, 130);
  x.font = '600 96px ' + font; x.fillText(tp(cur.temperature_2m).main, 160, 118);
  x.font = '500 30px ' + font; x.fillText(descOf(cur.weather_code), 164, 166);
  x.font = '600 30px ' + font; x.fillText(loc.name || '', 28, 214);
  x.textAlign = 'right'; x.font = '500 28px ' + font;
  x.fillText(t.high + ' ' + tp(dy.temperature_2m_max[0]).main + '  ' + t.low + ' ' + tp(dy.temperature_2m_min[0]).main, w - 24, 214);
  x.textAlign = 'left';
}
async function togglePip(){
  try{
    if(document.pictureInPictureElement){ await document.exitPictureInPicture(); return; }
    if(pip.vid && pip.vid.webkitPresentationMode === 'picture-in-picture'){ pip.vid.webkitSetPresentationMode('inline'); return; }
    if(!pip.cv){
      pip.cv = document.createElement('canvas'); pip.cv.width = 640; pip.cv.height = 240; pip.ctx = pip.cv.getContext('2d');
      pip.vid = document.createElement('video');
      pip.vid.muted = true; pip.vid.playsInline = true; pip.vid.setAttribute('playsinline',''); pip.vid.setAttribute('muted','');
      pip.vid.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
      document.body.appendChild(pip.vid);
      pip.vid.addEventListener('leavepictureinpicture', pipStopped);
      pip.vid.addEventListener('webkitpresentationmodechanged', () => { if(pip.vid.webkitPresentationMode !== 'picture-in-picture') pipStopped(); });
    }
    pip.on = true; pipDraw();
    if(!pip.vid.srcObject) pip.vid.srcObject = pip.cv.captureStream(5);
    await pip.vid.play();
    if(pip.vid.requestPictureInPicture) await pip.vid.requestPictureInPicture();
    else pip.vid.webkitSetPresentationMode('picture-in-picture');
    $('pipBtn').classList.add('on');
    clearInterval(pip.timer); pip.timer = setInterval(pipDraw, 1000);   // 프레임을 계속 갱신
  }catch(e){
    console.warn('PiP failed', e); pipStopped();
    setNote(activeLang() === 'ko' ? '이 브라우저에서는 PiP를 시작할 수 없습니다.' : 'Could not start Picture-in-Picture in this browser.');
  }
}
function pipStopped(){
  pip.on = false; clearInterval(pip.timer); pip.timer = null;
  $('pipBtn').classList.remove('on');
}
$('pipBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/></svg>';
if(pipSupported()) $('pipBtn').addEventListener('click', togglePip); else $('pipBtn').style.display = 'none';

/* ---------- settings panel ---------- */
const S18N = {
  ko:{title:'설정',level:'검색 범위',lvCity:'시·군',lvDist:'구 포함',lvAll:'읍·면·동 포함 (전체)',widget:'상단 미니 위젯',pip:'떠 있는 작은 창 (PiP)',
      wHint:'아이폰은 카메라(다이나믹 아일랜드) 위치에, 갤럭시는 왼쪽 위에 현재 날씨가 표시됩니다. 자동은 아이폰·갤럭시에서만 켜지고, 켜기는 PC 등에서도 왼쪽 위에 표시해요. 홈 화면에 추가한 앱으로 열면 상태바 영역까지 자연스럽게 보입니다.',
      lvHint:'구 포함: 서울 같은 곳은 동 단위 결과를 소속 구로 묶어 보여줍니다. 지역 데이터에 따라 일부 구는 빠질 수 있어요.',
      max:'검색 결과 수',temp:'온도 단위',auto:'자동',dual:'보조 단위 함께 표시',on:'켜기',off:'끄기',
      wind:'풍속 단위',precip:'강수량 단위',press:'기압 단위',hour:'시간 표기',h12:'12시간',h24:'24시간',anim:'배경 애니메이션',reset:'초기화',close:'닫기'},
  en:{title:'Settings',level:'Search scope',lvCity:'Cities / counties',lvDist:'Include districts',lvAll:'Everything (incl. towns)',widget:'Top mini widget',pip:'Floating mini window (PiP)',
      wHint:'Shows the current weather at the camera cutout (Dynamic Island) on iPhone and at the top-left on Galaxy. Auto only turns on for iPhone/Galaxy; On also shows it at the top-left elsewhere. Works best when opened from the Home Screen.',
      lvHint:'Districts: neighborhood results are grouped under their district (e.g. in Seoul). Some districts may be missing depending on the data.',
      max:'Number of results',temp:'Temperature unit',auto:'Auto',dual:'Show secondary units',on:'On',off:'Off',
      wind:'Wind unit',precip:'Precipitation unit',press:'Pressure unit',hour:'Time format',h12:'12-hour',h24:'24-hour',anim:'Background animation',reset:'Reset',close:'Close'}
};
const SL = () => S18N[activeLang()] || S18N.en;
const SETTING_ROWS = [
  ['level',[['city','lvCity'],['district','lvDist'],['all','lvAll']]],
  ['max',[[5,'5'],[8,'8'],[12,'12'],[20,'20']]],
  ['temp',[['auto','auto'],['C','°C'],['F','°F']]],
  ['dual',[[true,'on'],[false,'off']]],
  ['wind',[['kmh','km/h'],['mph','mph'],['ms','m/s']]],
  ['precip',[['mm','mm'],['in','in']]],
  ['press',[['hpa','hPa'],['inhg','inHg']]],
  ['hour',[['auto','auto'],['12','h12'],['24','h24']]],
  ['widget',[['auto','auto'],['on','on'],['off','off']]],
  ['anim',[[true,'on'],[false,'off']]]
];
function renderSettings(){
  const t = SL();
  $('setPanel').innerHTML = `<h2>${escapeHtml(t.title)}</h2>` +
    SETTING_ROWS.map(([k,opts]) => `<div class="srow"><div class="sl">${escapeHtml(t[k])}</div><div class="seg">` +
      opts.map(([v,lab]) => `<button type="button" data-k="${k}" data-v="${v}" class="${settings[k] === v ? 'on' : ''}">${escapeHtml(t[lab] || lab)}</button>`).join('') +
      `</div>${({level:'lvHint',widget:'wHint'})[k] ? `<div class="shint">${escapeHtml(t[({level:'lvHint',widget:'wHint'})[k]])}</div>` : ''}</div>`).join('') +
    `<div class="pfoot"><button type="button" id="setReset">${escapeHtml(t.reset)}</button><button type="button" id="setClose">${escapeHtml(t.close)}</button></div>`;
  $('setPanel').querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k, row = SETTING_ROWS.find(r => r[0] === k), opt = row[1].find(o => String(o[0]) === b.dataset.v);
    settings[k] = opt[0]; saveSettings(); renderSettings(); applySettings(k);
  }));
  $('setReset').addEventListener('click', () => { settings = Object.assign({}, SETTINGS_DEFAULT); saveSettings(); renderSettings(); applySettings(); });
  $('setClose').addEventListener('click', closeSettings);
}
function applySettings(k){
  if(state.data) render();
  if(!k || k === 'level' || k === 'max'){
    const v = $('q').value.trim();
    if(v.length >= 2) doSearch(v); else $('results').style.display = 'none';
  }
}
function openSettings(){ renderSettings(); $('setOverlay').classList.add('open'); }
function closeSettings(){ $('setOverlay').classList.remove('open'); }
$('setBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
$('setBtn').addEventListener('click', openSettings);
$('setOverlay').addEventListener('click', e => { if(e.target === $('setOverlay')) closeSettings(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSettings(); });

/* ---------- events ---------- */
$('locBtn').addEventListener('click', () => { try{ localStorage.removeItem('weather_loc'); }catch(e){} locate(); });
$('langSel').addEventListener('change', e=>{
  const v = e.target.value;
  state.manualLang = v==='auto' ? null : v;
  safeSet('weather_lang', v);
  applyStaticText();
  if(state.data) render();
  const cur = state.loc;
  localizeLoc().then(()=>{ if(state.loc === cur && state.data) render(); });

/* ---------- init ---------- */
(function init(){
  const saved = safeGet('weather_lang');
  if(saved && saved!=='auto' && I18N[saved]) state.manualLang = saved;
  applyStaticText();
  if(!window.isSecureContext && location.protocol !== 'file:') {
    setNote(state.manualLang === 'en' ? 'Location access usually requires HTTPS or localhost.' : '정확한 위치 권한은 HTTPS 또는 localhost에서 더 잘 작동합니다.');
  }
  const sl = savedLoc();
  if(sl) loadLocation(sl, {save:true}); else locate();
})();
